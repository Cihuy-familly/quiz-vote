name: Build and Push

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag"
        default: "1.0.0"
        required: false
        type: string

env:
  REGISTRY: registry.cihuyproject.my.id
  IMAGE_NAMESPACE: quiz-vote

jobs:
  test:
    runs-on: [self-hosted, cihuy-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Dockerfiles exist
        run: |
          services=("frontend" "vote-api" "result-api" "load-generator")
          for service in "${services[@]}"; do
            if [ -f "./services/$service/Dockerfile" ]; then
              echo "OK: services/$service/Dockerfile"
            else
              echo "FAIL: services/$service/Dockerfile not found"
              exit 1
            fi
          done

  build:
    needs: test
    runs-on: [self-hosted, cihuy-service]
    strategy:
      matrix:
        service: [frontend, vote-api, result-api, load-generator]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version tag
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}"
          elif [ -f VERSION ]; then
            echo "tag=$(cat VERSION)"
          else
            echo "tag=latest"
          fi >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ steps.version.outputs.tag }}
          cache-from: type=local,src=/tmp/.buildx-cache-${{ matrix.service }}
          cache-to: type=local,dest=/tmp/.buildx-cache-${{ matrix.service }}-new,mode=max

      - name: Save image to tar
        run: |
          docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ steps.version.outputs.tag }} | gzip > /tmp/${{ matrix.service }}.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-image
          path: /tmp/${{ matrix.service }}.tar.gz
          retention-days: 1

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache-${{ matrix.service }}
          mv /tmp/.buildx-cache-${{ matrix.service }}-new /tmp/.buildx-cache-${{ matrix.service }}

  push:
    needs: build
    runs-on: [self-hosted, cihuy-service]
    strategy:
      matrix:
        service: [frontend, vote-api, result-api, load-generator]
    steps:
      - name: Determine version tag
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}"
          elif [ -f VERSION ]; then
            echo "tag=$(cat VERSION)"
          else
            echo "tag=latest"
          fi >> "$GITHUB_OUTPUT"

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-image
          path: /tmp

      - name: Load image
        run: |
          docker load --input /tmp/${{ matrix.service }}.tar.gz

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Tag and push image
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ steps.version.outputs.tag }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ steps.version.outputs.tag }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:latest
