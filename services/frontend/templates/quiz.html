{% extends "base.html" %}
{% block title %}{{ quiz.title }} - Vote{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <a href="/" class="btn btn-sm btn-outline-secondary mb-3">&larr; Back to Quizzes</a>

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title mb-3">{{ quiz.title }}</h3>
                <p class="question-text mb-4">{{ quiz.question }}</p>

                <form action="{{ url_for('submit_vote', quiz_id=quiz.id) }}" method="POST" class="vote-form">
                    {% for option in quiz.options %}
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="option_id" id="option_{{ option.id }}" value="{{ option.id }}" {% if loop.first %}checked{% endif %} required>
                        <label class="form-check-label w-100" for="option_{{ option.id }}">
                            <span class="d-flex align-items-center">
                                <span class="option-label me-2">{{ ['A', 'B', 'C', 'D'][loop.index0] }}.</span>
                                <span class="option-value">{{ option.text }}</span>
                            </span>
                        </label>
                    </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-primary w-100 mt-3 btn-lg">
                        Submit Vote
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
